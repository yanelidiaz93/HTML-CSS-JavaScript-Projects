<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player">
        <div class="imagen"></div>
        <p class="now">Now Playing</p>
        <h3 id="title">Song Title</h3>
        <p id="artist">Artist name</p>
        
        <div class="progress">
            <input type="range" id="progress" value="0">
        </div>
        <div class="controls">
            <button id="prev">
                <img src="img/rewind-button.png">
            </button>
            <button id="play">
                <img src="img/play-button-arrowhead.png">
            </button>
            <button id="next">
                <img src="img/forward-button.png">
            </button>
        </div>

      

        <div class="volume">
            <i class="vo-icon">
                <img src="img/volume-up.png">
            </i>
            <input type="range" id="volume">
        </div>
    </div>
</body>
</html>
