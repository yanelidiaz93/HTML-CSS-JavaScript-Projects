<!DOCTYPE html> <!--Declaración del tipo de documento HTML5-->
<html lang="es"> <!--Idioma de la página web-->
<head>
    <meta charset="UTF-8"> <!--Codificación de caracteres para los documentos HTML
    UTF-8 admite una amplia gama de caracteres y símbolos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Gestiona el nivel de zoom inicial
    del navegador y el ancho del área visible, esto garantiza que la página se visualice correctamente en varios dispositivos-->
    <title>Generador de contraseñas aleatorias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="password-container">
        <h2>Generador de contraseñas aleatorias</h2>
        <div class="input-container">
            <input type="text" id="input" class="input" placeholder="Crear contraseña" readonly>
            <i class="fa-solid fa-copy fa-2x"></i>
        </div>
        <button class="btn">Generar</button>
    </div>

    <div class="alert-container active">Contraseña copiada</div>

    <script src="index.js"></script>
</body>
</html>
