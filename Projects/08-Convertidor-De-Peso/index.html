<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Peso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1 class="titulo">Convertidor de peso</h1>
        <div class="peso-container">
            <label for="libras">Libras:</label>
            <input type="number" id="input" class="input" step=".1" placeholder="Ingrese número">
        </div>
        <p>Su peso en kg es: <span id="resultado"></span></p>
        <p class="error" id="error"></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
